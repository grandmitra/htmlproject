<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Aplikasi Akses Terbatas</title>
    <style>
        /* Reset CSS & Layout Full Screen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container Pembungkus Utama */
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Animasi Loader Pemuatan */
        .app-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            z-index: 10;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.3px;
        }

        /* Overlay Login Menu */
        .login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            z-index: 20;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .login-card h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 16px;
        }

        .login-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #1d4ed8;
        }

        .error-msg {
            font-size: 12px;
            color: #dc2626;
            margin-top: 10px;
            display: none;
        }

        /* Tampilan Smooth iFrame */
        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-iframe.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Container Utama -->
    <div class="app-container">
      
        <!-- Overlay Login Menu -->
        <div class="login-overlay" id="loginOverlay">
            <div class="login-card">
                <h2>Akses Terbatas</h2>
                <p>Masukkan password untuk membuka aplikasi.</p>
                <input class="login-input" id="appPassword" placeholder="Masukkan Password..." type="password">
                <button class="login-btn" onclick="handleLogin()">Masuk Aplikasi</button>
                <div class="error-msg" id="errorMsg">Password salah, silakan coba lagi.</div>
            </div>
        </div>

        <!-- Loader -->
        <div class="app-loader" id="appLoader">
            <div class="spinner"></div>
            <div class="loader-text">Memuat Aplikasi...</div>
        </div>
      
        <!-- iFrame Google Apps Script -->
        <iframe allow="geolocation; microphone; camera; clipboard-write; autoplay" class="app-iframe" id="appScriptFrame" loading="lazy" onload="onIframeLoaded()" src="https://script.google.com/macros/s/AKfycbyRczraowXVRetgSQ1p2PiriPL1TRJE53Sa-Z840fp93cDa19pDGvkpAUspTMEaBUb1Pg/exec">
        </iframe>
    </div>

    <!-- JavaScript untuk mengatur loader, iframe, dan login -->
    <script>
        function onIframeLoaded() {
            var loader = document.querySelector('.app-loader');
            var iframe = document.getElementById('appScriptFrame');
            
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }
            
            if (iframe) {
                iframe.classList.add('loaded');
            }
        }

        function showLoader() {
            var loader = document.querySelector('.app-loader');
            var iframe = document.getElementById('appScriptFrame');
            
            if (loader) {
                loader.style.opacity = '1';
                loader.style.visibility = 'visible';
            }
            
            if (iframe) {
                iframe.classList.remove('loaded');
            }
        }

        function handleLogin() {
            var passInput = document.getElementById('appPassword').value;
            var errorMsg = document.getElementById('errorMsg');
            var loginOverlay = document.getElementById('loginOverlay');
            
            if (passInput === 'mbg212') {
                sessionStorage.setItem('isLoggedIn', 'true');
                loginOverlay.style.opacity = '0';
                loginOverlay.style.visibility = 'hidden';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('appPassword').style.borderColor = '#dc2626';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Cek jika sudah login sebelumnya di sesi ini
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                var loginOverlay = document.getElementById('loginOverlay');
                if (loginOverlay) {
                    loginOverlay.style.display = 'none';
                }
            }

            // Event listener untuk tombol Enter pada input password
            var passwordInput = document.getElementById('appPassword');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        handleLogin();
                    }
                });
            }

            var iframe = document.getElementById('appScriptFrame');
            if (iframe) {
                setTimeout(function() {
                    if (!iframe.classList.contains('loaded')) {
                        onIframeLoaded();
                    }
                }, 10000);
            }
        });
    </script>

</body>
</html>
