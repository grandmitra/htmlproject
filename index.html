<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Canvas System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Konfigurasi Tailwind untuk mendeteksi class 'dark'
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Transisi untuk Hide/Unhide Sidebar Desktop & Mobile */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Custom Smooth Transition for Accordion Submenu */
        .submenu-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
        }
        .submenu-content.open {
            max-height: 500px;
            transition: max-height 0.3s ease-in-out;
        }
        .rotate-arrow {
            transform: rotate(180deg);
        }
        /* Custom scrollbar for sidebar */
        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased h-screen overflow-hidden transition-colors duration-300">

    <!-- MOBILE OVERLAY BACKDROP -->
    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden lg:hidden transition-opacity duration-300 opacity-0"></div>

    <div class="flex h-full w-full relative">

        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="fixed lg:static top-0 left-0 h-full w-72 bg-slate-900 text-slate-300 flex flex-col z-40 -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none shrink-0">
            
            <!-- Brand Logo & Header -->
            <div class="h-16 flex items-center justify-between px-6 bg-slate-950/80 border-b border-slate-800">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                        <i class="fa-solid fa-layer-group text-lg"></i>
                    </div>
                    <span class="font-bold text-lg text-white tracking-wide">CANVAS<span class="text-blue-500">ROOT</span></span>
                </div>
                <!-- Close Button Mobile / Hide Sidebar -->
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white focus:outline-none p-1 rounded-lg hover:bg-slate-800 transition-colors">
                    <i class="fa-solid fa-xmark text-xl lg:hidden"></i>
                    <i class="fa-solid fa-chevron-left text-lg hidden lg:block" title="Sembunyikan Sidebar"></i>
                </button>
            </div>

            <!-- Sidebar Navigation Items (Dynamic Container) -->
            <nav id="sidebar-nav-container" class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto sidebar-scroll">
                <!-- Menu akan dimuat secara otomatis oleh fungsi JavaScript loadDynamicMenus() -->
            </nav>

            <!-- User Info Footer -->
            <div class="p-4 bg-slate-950/80 border-t border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-white font-semibold text-sm border border-slate-600">
                            SM
                        </div>
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full ring-2 ring-slate-900"></span>
                    </div>
                    <div class="text-xs">
                        <div class="font-semibold text-slate-200">Sofyan Mujid</div>
                        <div class="text-slate-500 text-[10px]">Administrator</div>
                    </div>
                </div>
                <button class="text-slate-400 hover:text-red-400 transition-colors p-2" title="Keluar">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>

        </aside>

        <!-- MAIN CONTENT CANVAS -->
        <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            
            <!-- TOPBAR HEADER -->
            <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 lg:px-8 z-20 transition-colors duration-300">
                <div class="flex items-center space-x-3">
                    <!-- Sidebar Toggle Button (Desktop & Mobile) -->
                    <button onclick="toggleSidebar()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none transition-colors" title="Toggle Sidebar">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <!-- Current Page Breadcrumb / Title -->
                    <div>
                        <h1 id="page-title" class="text-base lg:text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight">Dashboard</h1>
                        <p class="text-[11px] text-slate-400 dark:text-slate-500 hidden sm:block">Vercel Root Workspace</p>
                    </div>
                </div>

                <!-- Header Action Quick Options -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <!-- Light / Dark Mode Toggle Button -->
                    <button onclick="toggleDarkMode()" title="Ubah Mode Tampilan" class="p-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-amber-500 dark:hover:text-amber-400 transition-all">
                        <i id="theme-icon-sun" class="fa-solid fa-sun text-base hidden"></i>
                        <i id="theme-icon-moon" class="fa-solid fa-moon text-base"></i>
                    </button>

                    <button onclick="reloadCanvas()" title="Refresh Page" class="p-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">
                        <i class="fa-solid fa-rotate-right text-sm"></i>
                    </button>

                    <div class="h-5 w-px bg-slate-200 dark:bg-slate-800"></div>

                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/50">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span> Live
                    </span>
                </div>
            </header>

            <!-- MAIN CANVAS FRAME WORKSPACE -->
            <main class="flex-1 p-2 sm:p-4 lg:p-6 bg-slate-100 dark:bg-slate-950 overflow-hidden relative transition-colors duration-300">
                
                <!-- Loading State Indicator -->
                <div id="canvas-loader" class="absolute inset-0 bg-slate-100/80 dark:bg-slate-950/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center transition-opacity duration-200 opacity-0 pointer-events-none">
                    <div class="w-10 h-10 border-4 border-blue-500/20 border-t-blue-600 rounded-full animate-spin mb-3"></div>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Memuat Halaman...</span>
                </div>

                <div class="w-full h-full bg-white dark:bg-slate-900 rounded-xl lg:rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 overflow-hidden transition-colors duration-300">
                    <!-- Dynamic iFrame Canvas Container -->
                    <iframe id="content-canvas" src="" class="w-full h-full border-0" onload="hideLoader()"></iframe>
                </div>
            </main>

        </div>

    </div>

    <!-- INTERACTIVE JAVASCRIPT LOGIC -->
    <script>
        // 1. Toggle Sidebar (Sembunyikan / Tampilkan untuk Desktop & Mobile)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const isMobile = window.innerWidth < 1024;

            if (isMobile) {
                const isClosed = sidebar.classList.contains('-translate-x-full');
                if (isClosed) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                    setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
            } else {
                if (sidebar.classList.contains('lg:translate-x-0')) {
                    sidebar.classList.remove('lg:translate-x-0');
                    sidebar.classList.add('-translate-x-full', 'lg:-ml-72');
                } else {
                    sidebar.classList.remove('-translate-x-full', 'lg:-ml-72');
                    sidebar.classList.add('lg:translate-x-0');
                }
            }
        }

        // 2. Toggle Submenu Accordion (Expand / Collapse)
        function toggleSubmenu(submenuId, arrowId) {
            const submenu = document.getElementById(submenuId);
            const arrow = document.getElementById(arrowId);
            
            if (submenu) submenu.classList.toggle('open');
            if (arrow) arrow.classList.toggle('rotate-arrow');
        }

        // 3. Load Page into iFrame Canvas & Highlight Active Menu
        function loadPage(url, title, event) {
            if (event) event.preventDefault();

            const canvas = document.getElementById('content-canvas');
            const loader = document.getElementById('canvas-loader');
            const pageTitle = document.getElementById('page-title');

            loader.classList.remove('opacity-0', 'pointer-events-none');
            pageTitle.innerText = title;
            canvas.src = url;

            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-500/20');
                item.classList.add('text-slate-300');
            });

            if (event && event.currentTarget) {
                const target = event.currentTarget;
                target.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-500/20');
                target.classList.remove('text-slate-300', 'text-slate-400');
            }

            if (window.innerWidth < 1024) {
                const sidebar = document.getElementById('sidebar');
                if (!sidebar.classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }
        }

        // 4. Hide Loader once iFrame is loaded
        function hideLoader() {
            const loader = document.getElementById('canvas-loader');
            if (loader) loader.classList.add('opacity-0', 'pointer-events-none');
        }

        // 5. Reload Current Active Canvas iFrame
        function reloadCanvas() {
            const canvas = document.getElementById('content-canvas');
            const loader = document.getElementById('canvas-loader');
            loader.classList.remove('opacity-0', 'pointer-events-none');
            canvas.contentWindow.location.reload();
        }

        // 6. Load Dynamic Menus from LocalStorage (Sepenuhnya dari settings.html)
        function loadDynamicMenus() {
            const navContainer = document.getElementById('sidebar-nav-container');
            const menus = JSON.parse(localStorage.getItem('custom_menus')) || [];

            let htmlContent = `<div class="px-3 text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Main Navigation</div>`;

            // Pisahkan menu berdasarkan tipe
            const singleMenus = menus.filter(m => m.type === 'single');
            const dropdownMenus = menus.filter(m => m.type === 'dropdown');
            const subMenus = menus.filter(m => m.type === 'sub');

            // Render Menu Utama Single
            singleMenus.forEach(m => {
                htmlContent += `
                    <a href="#" onclick="loadPage('${m.url}', '${m.label}', event)" class="nav-item flex items-center space-x-3 px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 transition-all group">
                        <i class="${m.icon} w-5 text-slate-400 group-hover:text-blue-400 transition-colors"></i>
                        <span>${m.label}</span>
                    </a>
                `;
            });

            // Render Menu Utama Dropdown beserta Sub-menunya
            dropdownMenus.forEach(d => {
                const subs = subMenus.filter(s => s.parent === d.url || s.parent === d.label.toLowerCase());
                htmlContent += `
                    <div class="rounded-xl overflow-hidden my-1">
                        <button onclick="toggleSubmenu('${d.url}-submenu', '${d.url}-arrow')" class="w-full flex items-center justify-between px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition-all group">
                            <div class="flex items-center space-x-3">
                                <i class="${d.icon} w-5 text-slate-400 group-hover:text-blue-400 transition-colors"></i>
                                <span>${d.label}</span>
                            </div>
                            <i id="${d.url}-arrow" class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform duration-300"></i>
                        </button>
                        <div id="${d.url}-submenu" class="submenu-content bg-slate-950/40 rounded-b-xl space-y-1 px-3 py-1">
                `;
                
                subs.forEach(s => {
                    htmlContent += `
                        <a href="#" onclick="loadPage('${s.url}', '${s.label}', event)" class="nav-item flex items-center space-x-3 px-4 py-2.5 my-1 text-xs font-medium rounded-lg text-slate-400 hover:bg-blue-600/20 hover:text-blue-400 transition-all">
                            <i class="${s.icon} w-4 text-center"></i>
                            <span>${s.label}</span>
                        </a>
                    `;
                });

                htmlContent += `
                        </div>
                    </div>
                `;
            });

            // Menu Pengaturan selalu ada di bagian bawah navigasi
            htmlContent += `
                <div class="px-3 text-[11px] font-bold text-slate-500 uppercase tracking-wider my-4">Lainnya</div>
                <a href="#" onclick="loadPage('settings.html', 'Pengaturan Sistem', event)" class="nav-item flex items-center space-x-3 px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 transition-all group">
                    <i class="fa-solid fa-sliders w-5 text-slate-400 group-hover:text-blue-400 transition-colors"></i>
                    <span>Pengaturan</span>
                </a>
            `;

            navContainer.innerHTML = htmlContent;

            // Otomatis buka halaman pertama atau settings jika belum ada halaman yang dimuat
            const canvas = document.getElementById('content-canvas');
            if (!canvas.src || canvas.src === window.location.href) {
                if (singleMenus.length > 0) {
                    loadPage(singleMenus[0].url, singleMenus[0].label);
                } else {
                    loadPage('settings.html', 'Pengaturan Sistem');
                }
            }
        }

        // 7. Toggle Light / Dark Mode & Persist with LocalStorage
        function toggleDarkMode() {
            const html = document.documentElement;
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const html = document.documentElement;
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');

            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                html.classList.add('dark');
                html.classList.remove('light');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                html.classList.add('light');
                html.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        // 8. Event Listener Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadDynamicMenus(); // Muat seluruh menu dinamis dari LocalStorage/Settings
        });
    </script>
</body>
</html>
