<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Menu - Canvas Vercel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header Page -->
        <div class="flex items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Pengaturan & Manajemen Menu</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Tambah menu utama atau sub-menu dinamis ke dalam sidebar sistem.</p>
            </div>
            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-lg">
                <i class="fa-solid fa-sliders"></i>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- FORM TAMBAH MENU -->
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 h-fit">
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus text-blue-600"></i>
                    <span>Tambah Menu Baru</span>
                </h2>

                <form id="menu-form" onsubmit="saveNewMenu(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipe Menu</label>
                        <select id="menu-type" onchange="toggleParentDropdown()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600">
                            <option value="single">Menu Utama (Single)</option>
                            <option value="dropdown">Menu Utama (Punya Dropdown)</option>
                            <option value="sub">Sub-Menu (Anak dari Laporan/Lainnya)</option>
                        </select>
                    </div>

                    <div id="parent-container" class="hidden">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Induk Menu</label>
                        <select id="menu-parent" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600">
                            <!-- Diisi dinamis via JS -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Label Menu</label>
                        <input type="text" id="menu-label" required placeholder="Contoh: Stok Gudang" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama File HTML (.html)</label>
                        <input type="text" id="menu-url" required placeholder="Contoh: gudang.html" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ikon (FontAwesome)</label>
                        <input type="text" id="menu-icon" value="fa-solid fa-file-lines" placeholder="fa-solid fa-box" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600">
                        <span class="text-[10px] text-slate-400 mt-1 block">Gunakan class dari FontAwesome 6.</span>
                    </div>

                    <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-500/20 transition-all">
                        Simpan & Tambahkan Menu
                    </button>
                </form>
            </div>

            <!-- DAFTAR MENU Kustom YANG AKTIF -->
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center space-x-2">
                        <i class="fa-solid fa-list-check text-blue-600"></i>
                        <span>Daftar Menu Kustom Tersimpan</span>
                    </h2>
                    <button onclick="resetDefaultMenus()" class="text-xs text-red-500 hover:text-red-700 font-semibold">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Reset Default
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                                <th class="py-3 px-4">Label</th>
                                <th class="py-3 px-4">Target File</th>
                                <th class="py-3 px-4">Tipe / Induk</th>
                                <th class="py-3 px-4 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="custom-menu-table" class="text-sm divide-y divide-slate-100">
                            <!-- Diisi via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Ambil data menu custom dari LocalStorage atau buat default array kosong
        function getCustomMenus() {
            return JSON.parse(localStorage.getItem('custom_menus')) || [];
        }

        function toggleParentDropdown() {
            const type = document.getElementById('menu-type').value;
            const container = document.getElementById('parent-container');
            const parentSelect = document.getElementById('menu-parent');

            if (type === 'sub') {
                container.classList.remove('hidden');
                // Isi dropdown dengan opsi menu utama yang ber-dropdown atau bisa jadi induk
                parentSelect.innerHTML = `
                    <option value="laporan">Laporan (Dropdown)</option>
                    <option value="lainnya">Lainnya</option>
                `;
            } else {
                container.classList.add('hidden');
            }
        }

        function saveNewMenu(e) {
            e.preventDefault();
            const type = document.getElementById('menu-type').value;
            const label = document.getElementById('menu-label').value;
            const url = document.getElementById('menu-url').value;
            const icon = document.getElementById('menu-icon').value;
            const parent = document.getElementById('menu-parent').value;

            const newMenu = { id: Date.now(), type, label, url, icon, parent };
            
            let menus = getCustomMenus();
            menus.push(newMenu);
            localStorage.setItem('custom_menus', JSON.stringify(menus));

            alert('Menu berhasil disimpan! Perubahan akan disinkronkan ke index.html.');
            
            // Reset form
            document.getElementById('menu-form').reset();
            toggleParentDropdown();
            renderTable();

            // Beritahu parent window (index.html) untuk me-refresh menu sidebar secara langsung jika fungsi tersedia
            if (window.parent && typeof window.parent.loadDynamicMenus === 'function') {
                window.parent.loadDynamicMenus();
            }
        }

        function deleteMenu(id) {
            if (confirm('Hapus menu ini dari daftar?')) {
                let menus = getCustomMenus();
                menus = menus.filter(m => m.id !== id);
                localStorage.setItem('custom_menus', JSON.stringify(menus));
                renderTable();

                if (window.parent && typeof window.parent.loadDynamicMenus === 'function') {
                    window.parent.loadDynamicMenus();
                }
            }
        }

        function resetDefaultMenus() {
            if (confirm('Reset seluruh menu kustom ke setelan awal?')) {
                localStorage.removeItem('custom_menus');
                renderTable();
                if (window.parent && typeof window.parent.loadDynamicMenus === 'function') {
                    window.parent.loadDynamicMenus();
                }
            }
        }

        function renderTable() {
            const tbody = document.getElementById('custom-menu-table');
            const menus = getCustomMenus();

            if (menus.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400 text-xs">Belum ada menu kustom yang ditambahkan.</td></tr>`;
                return;
            }

            tbody.innerHTML = menus.map(m => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-3 px-4 font-medium text-slate-800 flex items-center space-x-2">
                        <i class="${m.icon} text-blue-500 w-5"></i>
                        <span>${m.label}</span>
                    </td>
                    <td class="py-3 px-4 text-slate-500 font-mono text-xs">${m.url}</td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 bg-slate-100 text-slate-600 rounded text-[11px] font-semibold">
                            ${m.type === 'sub' ? 'Sub: ' + m.parent : (m.type === 'dropdown' ? 'Dropdown Main' : 'Single Main')}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="deleteMenu(${m.id})" class="p-1.5 text-slate-400 hover:text-red-500 transition-colors">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        window.onload = renderTable;
    </script>
</body>
</html>
