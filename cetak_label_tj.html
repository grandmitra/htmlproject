<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label Tom & Jerry - Custom Font Promo 0.5em - 7.0em</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts untuk pilihan Font POP Marketing -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- SheetJS (xlsx) untuk membaca & membuat file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        /* CSS Cetak Dinamis Sesuai Pilihan Orientasi */
        @media print {
            @page {
                size: var(--page-orientation, portrait);
                margin: 0 !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                background: transparent !important;
            }
            .sheet-page {
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always;
            }
            .label-card {
                border: 1px dashed transparent !important;
            }
        }

        /* Styling Sheet Stiker */
        .sheet-page {
            background-color: white;
            box-sizing: border-box;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            display: grid;
        }

        .label-card {
            box-sizing: border-box;
            border: 1px dashed #d1d5db;
            position: relative;
            overflow: hidden;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-blue-600 text-white p-4 shadow-md no-print">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-print"></i> Cetak Label Tom & Jerry (POP Retail Marketing)
            </h1>
            <button onclick="window.print()" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-bold flex items-center gap-2 shadow transition">
                <i class="fa-solid fa-print"></i> Cetak Sekarang
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Panel Form Input -->
        <section class="lg:col-span-5 bg-white p-5 rounded-xl shadow-sm border border-gray-200 no-print space-y-4">
            <h2 class="text-lg font-bold border-b pb-2 text-gray-700 flex items-center justify-between">
                <span class="flex items-center gap-2"><i class="fa-solid fa-sliders"></i> Pengaturan & Data Barang</span>
            </h2>

            <!-- Pilih Ukuran Label -->
            <div>
                <label for="labelSelect" class="block text-sm font-semibold text-gray-700 mb-1">
                    Tipe / Ukuran Label Tom & Jerry (No. 95 - 130)
                </label>
                <select id="labelSelect" class="w-full border-gray-300 rounded-lg shadow-sm border p-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 text-sm">
                </select>
                <p id="labelDetailInfo" class="text-xs text-blue-600 font-medium mt-1"></p>
            </div>

            <!-- Pengaturan Orientasi Kertas (Portrait / Landscape) -->
            <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg space-y-2">
                <label class="block text-xs font-bold text-amber-800 uppercase">
                    <i class="fa-solid fa-compass"></i> Orientasi Halaman Cetak
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex items-center gap-2 bg-white p-2 rounded border border-amber-200 cursor-pointer text-xs font-semibold">
                        <input type="radio" name="orientation" value="portrait" checked class="text-amber-600"> Portrait (Tegak)
                    </label>
                    <label class="flex items-center gap-2 bg-white p-2 rounded border border-amber-200 cursor-pointer text-xs font-semibold">
                        <input type="radio" name="orientation" value="landscape" class="text-amber-600"> Landscape (Mendatar)
                    </label>
                </div>
            </div>

            <!-- Pengaturan Tipografi & Ukuran Font -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-3">
                <label class="block text-xs font-bold text-gray-700 uppercase">
                    <i class="fa-solid fa-font"></i> Tipografi & Desain POP Marketing
                </label>
                
                <div>
                    <label class="block text-[10px] text-gray-600 mb-1">Pilihan Jenis Font (Font Family)</label>
                    <select id="fontFamilySelect" class="w-full border rounded p-1.5 text-xs bg-white font-semibold">
                        <option value="'Oswald', sans-serif">Oswald (Rekomendasi POP / Harga Tebal)</option>
                        <option value="'Montserrat', sans-serif">Montserrat (Modern & Clean)</option>
                        <option value="'Poppins', sans-serif">Poppins (Bulat & Nyaman Dibaca)</option>
                        <option value="'Inter', sans-serif">Inter (Standar Perusahaan)</option>
                        <option value="Arial, sans-serif">Arial Bold (Klasik)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-600">Font SKU/Nama</label>
                        <select id="generalFontDesc" class="w-full border rounded p-1 text-xs bg-white">
                            <option value="xs">Kecil</option>
                            <option value="sm" selected>Normal</option>
                            <option value="md">Besar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-600">Font Reguler</label>
                        <select id="generalFontReg" class="w-full border rounded p-1 text-xs bg-white">
                            <option value="xs">Kecil</option>
                            <option value="sm" selected>Normal</option>
                            <option value="md">Besar</option>
                        </select>
                    </div>
                </div>

                <!-- Custom Range Font Promo (0.5em - 7.0em) -->
                <div class="bg-white p-2 rounded border border-gray-200 space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-bold text-gray-700 uppercase">Ukuran Font Harga Promo</label>
                        <span id="promoFontSizeValue" class="text-xs font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded">2.0em</span>
                    </div>
                    <input type="range" id="fontPromoRange" min="0.5" max="7.0" step="0.1" value="2.0" class="w-full accent-red-600 cursor-pointer">
                    <div class="flex justify-between text-[9px] text-gray-400">
                        <span>0.5em (Kecil)</span>
                        <span>3.5em (Sedang)</span>
                        <span>7.0em (Maksimal)</span>
                    </div>
                </div>
            </div>

            <!-- Fitur Template & Upload Excel / CSV -->
            <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg space-y-3">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-bold text-blue-800 uppercase">
                        <i class="fa-solid fa-file-excel"></i> Data Massal (Excel / CSV)
                    </label>
                    <button type="button" id="btnDownloadTemplate" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] px-2.5 py-1 rounded font-semibold flex items-center gap-1 shadow-sm">
                        <i class="fa-solid fa-download"></i> Template Excel
                    </button>
                </div>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
            </div>

            <!-- Container Daftar Produk Dinamis -->
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-gray-700">Daftar Barang Manual</h3>
                <button type="button" id="btnAddItem" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Tambah Barang
                </button>
            </div>

            <div id="productItemsContainer" class="space-y-4 max-h-[250px] overflow-y-auto pr-1">
                <!-- Form item di-render secara dinamis via JS -->
            </div>
        </section>

        <!-- Area Preview Cetak -->
        <section class="lg:col-span-7 print-area flex flex-col items-center">
            <div class="w-full bg-white p-3 rounded-lg shadow-sm border border-gray-200 mb-4 no-print flex justify-between items-center">
                <span class="font-bold text-gray-700 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-eye text-blue-500"></i> Pratinjau Lembar Cetak
                </span>
                <span id="previewOrientationLabel" class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-1 rounded border border-amber-200">Mode: Portrait</span>
            </div>

            <!-- Kontainer Sheet Stiker -->
            <div id="paperSheet" class="sheet-page"></div>
        </section>

    </main>

    <script>
        // DATABASE LENGKAP TOM & JERRY (No. 95 - 130)
        const LABEL_SIZES = [
            { id: "103", name: "TnJ No. 103", width: 64, height: 32, cols: 3, rows: 4, marginT: 10, marginL: 5, marginR: 7, gapX: 2, gapY: 3, pageW: 210, pageH: 165 },
            { id: "95",  name: "TnJ No. 95",  width: 12, height: 30, cols: 11,rows: 5, marginT: 8,  marginL: 8, marginR: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "96",  name: "TnJ No. 96",  width: 12, height: 42, cols: 11,rows: 3, marginT: 10, marginL: 8, marginR: 8, gapX: 2, gapY: 3, pageW: 210, pageH: 165 },
            { id: "97",  name: "TnJ No. 97",  width: 19, height: 50, cols: 7, rows: 3, marginT: 8,  marginL: 8, marginR: 8, gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "98",  name: "TnJ No. 98",  width: 38, height: 16, cols: 5, rows: 8, marginT: 14, marginL: 8, marginR: 8, gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "99",  name: "TnJ No. 99",  width: 38, height: 23, cols: 5, rows: 6, marginT: 12, marginL: 8, marginR: 8, gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "100", name: "TnJ No. 100", width: 38, height: 38, cols: 5, rows: 4, marginT: 6,  marginL: 8, marginR: 8, gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "101", name: "TnJ No. 101", width: 50, height: 16, cols: 4, rows: 8, marginT: 14, marginL: 4, marginR: 4, gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "102", name: "TnJ No. 102", width: 50, height: 23, cols: 4, rows: 6, marginT: 12, marginL: 4, marginR: 4, gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "104", name: "TnJ No. 104", width: 74, height: 24, cols: 2, rows: 6, marginT: 8,  marginL: 6, marginR: 6, gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "105", name: "TnJ No. 105", width: 37, height: 24, cols: 5, rows: 6, marginT: 8,  marginL: 6, marginR: 6, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "106", name: "TnJ No. 106", width: 50, height: 25, cols: 4, rows: 6, marginT: 7,  marginL: 12,marginR: 12,gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "107", name: "TnJ No. 107", width: 50, height: 18, cols: 4, rows: 8, marginT: 7,  marginL: 8, marginR: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "108", name: "TnJ No. 108", width: 38, height: 18, cols: 5, rows: 8, marginT: 6,  marginL: 8, marginR: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "109", name: "TnJ No. 109", width: 38, height: 13, cols: 5, rows: 11,marginT: 6,  marginL: 10,marginR: 10,gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "110", name: "TnJ No. 110", width: 23, height: 14, cols: 8, rows: 10,marginT: 12, marginL: 10,marginR: 10,gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "116", name: "TnJ No. 116", width: 100,height: 60, cols: 2, rows: 2, marginT: 20, marginL: 5, marginR: 5, gapX: 4, gapY: 4, pageW: 210, pageH: 165 },
            { id: "121", name: "TnJ No. 121", width: 75, height: 38, cols: 2, rows: 4, marginT: 7,  marginL: 25,marginR: 25,gapX: 6, gapY: 3, pageW: 210, pageH: 165 },
            { id: "130", name: "TnJ No. 130", width: 85, height: 30, cols: 2, rows: 5, marginT: 10, marginL: 15,marginR: 15,gapX: 5, gapY: 2, pageW: 210, pageH: 165 }
        ];

        let productList = [
            {
                badge: "PROMO",
                sku: "SALV-60X60",
                desc: "SALVADORE CREAM 60X60 @1,44 M2 POLISHED",
                regPrice: "140.500",
                promoPrice: "125.284",
                unit: "dus",
                startDate: "01/11",
                endDate: "30/11",
                qty: 6
            }
        ];

        const FONT_MAP_DESC = { 'xs': 'text-[0.5em]', 'sm': 'text-[0.62em]', 'md': 'text-[0.75em]' };
        const FONT_MAP_REG  = { 'xs': 'text-[0.5em]', 'sm': 'text-[0.6em]', 'md': 'text-[0.7em]' };

        document.addEventListener('DOMContentLoaded', () => {
            initLabelOptions();
            renderProductForm();
            setupEventListeners();
            renderPreview();
        });

        function initLabelOptions() {
            const select = document.getElementById('labelSelect');
            select.innerHTML = '';
            LABEL_SIZES.forEach(label => {
                const opt = document.createElement('option');
                opt.value = label.id;
                opt.textContent = `${label.name} (${label.width} x ${label.height} mm - ${label.cols * label.rows} pcs)`;
                select.appendChild(opt);
            });
            select.value = "103";
            updateDetailInfo();
        }

        function updateDetailInfo() {
            const current = getCurrentLabel();
            const info = document.getElementById('labelDetailInfo');
            if(current) {
                info.textContent = `Margin (T: ${current.marginT}mm, L: ${current.marginL}mm) | Sheet: ${current.pageW}x${current.pageH} mm`;
            }
        }

        function getCurrentLabel() {
            const val = document.getElementById('labelSelect').value;
            return LABEL_SIZES.find(l => l.id === val) || LABEL_SIZES[0];
        }

        function renderProductForm() {
            const container = document.getElementById('productItemsContainer');
            container.innerHTML = '';

            productList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-2 relative';
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-1">
                        <span class="text-xs font-bold text-blue-600">Barang #${index + 1}</span>
                        ${productList.length > 1 ? `<button type="button" onclick="removeProduct(${index})" class="text-red-500 hover:text-red-700 text-xs font-bold"><i class="fa-solid fa-trash"></i> Hapus</button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Badge</label>
                            <input type="text" data-index="${index}" data-field="badge" value="${item.badge || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">SKU</label>
                            <input type="text" data-index="${index}" data-field="sku" value="${item.sku || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-gray-600 uppercase">Deskripsi</label>
                        <input type="text" data-index="${index}" data-field="desc" value="${item.desc || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Reguler</label>
                            <input type="text" data-index="${index}" data-field="regPrice" value="${item.regPrice || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Promo</label>
                            <input type="text" data-index="${index}" data-field="promoPrice" value="${item.promoPrice || ''}" class="product-input w-full border rounded p-1.5 text-xs text-red-600 font-bold border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Satuan</label>
                            <input type="text" data-index="${index}" data-field="unit" value="${item.unit || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Start</label>
                            <input type="text" data-index="${index}" data-field="startDate" value="${item.startDate || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">End</label>
                            <input type="text" data-index="${index}" data-field="endDate" value="${item.endDate || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Qty</label>
                            <input type="number" min="1" data-index="${index}" data-field="qty" value="${item.qty || 1}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.querySelectorAll('.product-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    const field = e.target.getAttribute('data-field');
                    productList[idx][field] = e.target.value;
                    renderPreview();
                });
            });
        }

        function addProduct() {
            productList.push({
                badge: "PROMO",
                sku: "SKU-BARU",
                desc: "NAMA BARANG",
                regPrice: "50.000",
                promoPrice: "45.000",
                unit: "pcs",
                startDate: "",
                endDate: "",
                qty: 1
            });
            renderProductForm();
            renderPreview();
        }

        function removeProduct(index) {
            productList.splice(index, 1);
            renderProductForm();
            renderPreview();
        }

        function setupEventListeners() {
            document.getElementById('labelSelect').addEventListener('change', () => {
                updateDetailInfo();
                renderPreview();
            });
            document.getElementById('btnAddItem').addEventListener('click', addProduct);
            
            ['generalFontDesc', 'generalFontReg', 'fontFamilySelect'].forEach(id => {
                document.getElementById(id).addEventListener('change', renderPreview);
            });

            // Event listener untuk Slider Font Promo Range (0.5em - 7.0em)
            const rangeInput = document.getElementById('fontPromoRange');
            rangeInput.addEventListener('input', (e) => {
                document.getElementById('promoFontSizeValue').textContent = `${e.target.value}em`;
                renderPreview();
            });

            document.querySelectorAll('input[name="orientation"]').forEach(radio => {
                radio.addEventListener('change', renderPreview);
            });

            document.getElementById('btnDownloadTemplate').addEventListener('click', () => {
                const templateData = [{
                    badge: "PROMO", sku: "SKU-001", desc: "CONTOH NAMA BARANG RETAIL",
                    regPrice: "100.000", promoPrice: "85.000", unit: "pcs",
                    startDate: "01/11", endDate: "30/11", qty: 6
                }];
                const worksheet = XLSX.utils.json_to_sheet(templateData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Template Label");
                XLSX.writeFile(workbook, "Template_Cetak_Label_TomJerry.xlsx");
            });

            document.getElementById('excelFile').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        if (jsonRows.length > 0) {
                            productList = jsonRows.map(row => ({
                                badge: row.badge || "PROMO", sku: row.sku || "", desc: row.desc || "",
                                regPrice: row.regPrice || "0", promoPrice: row.promoPrice || "0",
                                unit: row.unit || "pcs", startDate: row.startDate || "",
                                endDate: row.endDate || "", qty: parseInt(row.qty) || 1
                            }));
                            renderProductForm();
                            renderPreview();
                            alert(`Berhasil memuat ${productList.length} produk dari file!`);
                        }
                    } catch (err) {
                        alert("Gagal membaca file Excel/CSV.");
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function renderPreview() {
            const label = getCurrentLabel();
            const sheet = document.getElementById('paperSheet');
            const orientation = document.querySelector('input[name="orientation"]:checked').value;
            const fontFamily = document.getElementById('fontFamilySelect').value;
            const customPromoSize = document.getElementById('fontPromoRange').value;

            document.documentElement.style.setProperty('--page-orientation', orientation);
            document.getElementById('previewOrientationLabel').textContent = `Mode: ${orientation === 'landscape' ? 'Landscape (Mendatar)' : 'Portrait (Tegak)'}`;

            let pWidth = label.pageW;
            let pHeight = label.pageH;
            if (orientation === 'landscape') {
                pWidth = label.pageH;
                pHeight = label.pageW;
            }

            sheet.style.width = `${pWidth}mm`;
            sheet.style.height = `${pHeight}mm`;
            sheet.style.paddingTop = `${label.marginT}mm`;
            sheet.style.paddingLeft = `${label.marginL}mm`;
            sheet.style.paddingRight = `${label.marginR || 0}mm`;
            sheet.style.gridTemplateColumns = `repeat(${label.cols}, ${label.width}mm)`;
            sheet.style.gridTemplateRows = `repeat(${label.rows}, ${label.height}mm)`;
            sheet.style.columnGap = `${label.gapX}mm`;
            sheet.style.rowGap = `${label.gapY}mm`;
            sheet.style.fontFamily = fontFamily;
            sheet.innerHTML = '';

            const totalSlots = label.cols * label.rows;
            let renderQueue = [];
            productList.forEach(prod => {
                for(let q = 0; q < parseInt(prod.qty || 1); q++) {
                    renderQueue.push(prod);
                }
            });

            const fDesc = FONT_MAP_DESC[document.getElementById('generalFontDesc').value];
            const fReg = FONT_MAP_REG[document.getElementById('generalFontReg').value];

            for (let i = 0; i < totalSlots; i++) {
                const card = document.createElement('div');
                card.className = 'label-card p-1 text-gray-800 leading-none flex flex-col justify-between';
                card.style.width = `${label.width}mm`;
                card.style.height = `${label.height}mm`;

                if (i < renderQueue.length) {
                    const p = renderQueue[i];
                    const badgeHtml = p.badge 
                        ? `<span class="bg-red-600 text-white font-black rounded-full px-1.5 py-0.5 text-[0.45em] tracking-tighter uppercase whitespace-nowrap">${p.badge}</span>`
                        : `<span></span>`;

                    const dateHtml = (p.startDate || p.endDate) 
                        ? `<span class="text-[0.4em] text-gray-500 font-semibold">${p.startDate || ''}-${p.endDate || ''}</span>` 
                        : '';

                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-gray-300 pb-0.5 gap-1">
                            ${badgeHtml}
                            <div class="flex items-center gap-1">
                                ${dateHtml}
                                <span class="font-mono text-[0.48em] text-gray-600 font-bold whitespace-nowrap">${p.sku}</span>
                            </div>
                        </div>
                        <div class="text-center font-extrabold leading-tight uppercase my-0.5 tracking-tight text-gray-900 line-clamp-2 ${fDesc}">
                            ${p.desc}
                        </div>
                        <div class="relative flex-1 flex items-center justify-center min-h-0">
                            <div class="absolute top-0 left-0 text-gray-400 line-through font-semibold whitespace-nowrap ${fReg}">
                                Rp${p.regPrice}
                            </div>
                            <div class="text-red-600 font-black tracking-tighter flex items-baseline justify-center" style="font-size: ${customPromoSize}em;">
                                <span class="text-[0.3em] mr-0.5 font-bold">Rp</span>
                                <span>${p.promoPrice}</span>
                            </div>
                        </div>
                        <div class="text-right border-t border-gray-200 pt-0.5">
                            <span class="text-blue-900 font-bold text-[0.55em]">/ ${p.unit}</span>
                        </div>
                    `;
                } else {
                    card.style.border = '1px dashed #e5e7eb';
                    card.style.background = '#fafafa';
                }
                sheet.appendChild(card);
            }
        }
    </script>
</body>
</html>
