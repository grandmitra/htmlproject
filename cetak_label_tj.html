<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label Tom & Jerry - Template & Import Excel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) untuk membaca & membuat file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        /* CSS Cetak Presisi */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                background: transparent !important;
            }
            .sheet-page {
                margin: 0 auto !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always;
            }
            .label-card {
                border: 1px dashed transparent !important;
            }
        }

        /* Styling Sheet Stiker */
        .sheet-page {
            background-color: white;
            box-sizing: border-box;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
            display: grid;
        }

        .label-card {
            box-sizing: border-box;
            border: 1px dashed #d1d5db;
            position: relative;
            overflow: hidden;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-blue-600 text-white p-4 shadow-md no-print">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-print"></i> Cetak Label Tom & Jerry (Template & Import)
            </h1>
            <button onclick="window.print()" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-bold flex items-center gap-2 shadow transition">
                <i class="fa-solid fa-print"></i> Cetak Sekarang
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Panel Form Input -->
        <section class="lg:col-span-5 bg-white p-5 rounded-xl shadow-sm border border-gray-200 no-print space-y-4">
            <h2 class="text-lg font-bold border-b pb-2 text-gray-700 flex items-center justify-between">
                <span class="flex items-center gap-2"><i class="fa-solid fa-sliders"></i> Pengaturan & Data Barang</span>
            </h2>

            <!-- Pilih Ukuran Label -->
            <div>
                <label for="labelSelect" class="block text-sm font-semibold text-gray-700 mb-1">
                    Tipe / Ukuran Label Tom & Jerry (No. 95 - 130)
                </label>
                <select id="labelSelect" class="w-full border-gray-300 rounded-lg shadow-sm border p-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 text-sm">
                </select>
                <p id="labelDetailInfo" class="text-xs text-blue-600 font-medium mt-1"></p>
            </div>

            <!-- Fitur Template & Upload Excel / CSV -->
            <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg space-y-3">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-bold text-blue-800 uppercase">
                        <i class="fa-solid fa-file-excel"></i> Data Massal (Excel / CSV)
                    </label>
                    <button type="button" id="btnDownloadTemplate" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] px-2.5 py-1 rounded font-semibold flex items-center gap-1 shadow-sm">
                        <i class="fa-solid fa-download"></i> Download Template
                    </button>
                </div>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                <p class="text-[10px] text-gray-500">Header: badge, sku, desc, regPrice, promoPrice, unit, startDate, endDate, qty</p>
            </div>

            <!-- Pengaturan Font General -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">
                    <i class="fa-solid fa-font"></i> Ukuran Font General
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-600">Font SKU & Nama</label>
                        <select id="generalFontDesc" class="w-full border rounded p-1 text-xs bg-white">
                            <option value="xs">Kecil</option>
                            <option value="sm" selected>Normal</option>
                            <option value="md">Besar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-600">Font Reguler</label>
                        <select id="generalFontReg" class="w-full border rounded p-1 text-xs bg-white">
                            <option value="xs">Kecil</option>
                            <option value="sm" selected>Normal</option>
                            <option value="md">Besar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-600">Font Promo</label>
                        <select id="generalFontPromo" class="w-full border rounded p-1 text-xs bg-white">
                            <option value="sm">Normal (1.5em)</option>
                            <option value="md" selected>Besar (2.0em)</option>
                            <option value="lg">Super Besar (2.5em)</option>
                        </select>
                    </div>
                </div>
            </div>

            <hr class="my-3">

            <!-- Container Daftar Produk Dinamis -->
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-gray-700">Daftar Barang Manual</h3>
                <button type="button" id="btnAddItem" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Tambah Barang
                </button>
            </div>

            <div id="productItemsContainer" class="space-y-4 max-h-[320px] overflow-y-auto pr-1">
                <!-- Form item di-render secara dinamis via JS -->
            </div>
        </section>

        <!-- Area Preview Cetak -->
        <section class="lg:col-span-7 print-area flex flex-col items-center">
            <div class="w-full bg-white p-3 rounded-lg shadow-sm border border-gray-200 mb-4 no-print flex justify-between items-center">
                <span class="font-bold text-gray-700 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-eye text-blue-500"></i> Pratinjau Lembar Cetak
                </span>
                <span class="text-xs text-gray-500">Otomatis menyusun antrian stiker</span>
            </div>

            <!-- Kontainer Sheet Stiker -->
            <div id="paperSheet" class="sheet-page"></div>
        </section>

    </main>

            { id: "106", name: "TnJ No. 106", width: 50, height: 25, cols: 4, rows: 6, marginT: 7,  marginL: 12,gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "107", name: "TnJ No. 107", width: 50, height: 18, cols: 4, rows: 8, marginT: 7,  marginL: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "108", name: "TnJ No. 108", width: 38, height: 18, cols: 5, rows: 8, marginT: 6,  marginL: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "109", name: "TnJ No. 109", width: 38, height: 13, cols: 5, rows: 11,marginT: 6,  marginL: 10,gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "110", name: "TnJ No. 110", width: 23, height: 14, cols: 8, rows: 10,marginT: 12, marginL: 10,gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "111", name: "TnJ No. 111", width: 18, height: 14, cols: 10,rows: 10,marginT: 10, marginL: 10,gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "112", name: "TnJ No. 112", width: 20, height: 8,  cols: 9, rows: 16,marginT: 12, marginL: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "113", name: "TnJ No. 113", width: 11, height: 11, cols: 16,rows: 12,marginT: 10, marginL: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "114", name: "TnJ No. 114", width: 15, height: 11, cols: 12,rows: 12,marginT: 10, marginL: 8, gapX: 2, gapY: 2, pageW: 210, pageH: 165 },
            { id: "115", name: "TnJ No. 115", width: 30, height: 15, cols: 6, rows: 9, marginT: 12, marginL: 10,gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "116", name: "TnJ No. 116", width: 100,height: 60, cols: 2, rows: 2, marginT: 20, marginL: 5, gapX: 4, gapY: 4, pageW: 210, pageH: 165 },
            { id: "117", name: "TnJ No. 117", width: 130,height: 60, cols: 1, rows: 2, marginT: 20, marginL: 40,gapX: 0, gapY: 4, pageW: 210, pageH: 165 },
            { id: "118", name: "TnJ No. 118", width: 90, height: 50, cols: 2, rows: 3, marginT: 7,  marginL: 12,gapX: 4, gapY: 4, pageW: 210, pageH: 165 },
            { id: "119", name: "TnJ No. 119", width: 130,height: 90, cols: 1, rows: 1, marginT: 37, marginL: 40,gapX: 0, gapY: 0, pageW: 210, pageH: 165 },
            { id: "120", name: "TnJ No. 120", width: 118,height: 78, cols: 1, rows: 2, marginT: 5,  marginL: 46,gapX: 0, gapY: 4, pageW: 210, pageH: 165 },
            { id: "121", name: "TnJ No. 121", width: 75, height: 38, cols: 2, rows: 4, marginT: 7,  marginL: 25,gapX: 6, gapY: 3, pageW: 210, pageH: 165 },
            { id: "122", name: "TnJ No. 122", width: 85, height: 17, cols: 2, rows: 8, marginT: 12, marginL: 15,gapX: 6, gapY: 2, pageW: 210, pageH: 165 },
            { id: "123", name: "TnJ No. 123", width: 30, height: 12, cols: 6, rows: 11,marginT: 10, marginL: 12,gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "124", name: "TnJ No. 124", width: 55, height: 40, cols: 3, rows: 3, marginT: 20, marginL: 18,gapX: 6, gapY: 5, pageW: 210, pageH: 165 },
            { id: "125", name: "TnJ No. 125", width: 57, height: 31, cols: 3, rows: 4, marginT: 15, marginL: 15,gapX: 4, gapY: 4, pageW: 210, pageH: 165 },
            { id: "126", name: "TnJ No. 126", width: 45, height: 10, cols: 4, rows: 13,marginT: 12, marginL: 12,gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "127", name: "TnJ No. 127", width: 70, height: 35, cols: 2, rows: 4, marginT: 12, marginL: 30,gapX: 10,gapY: 3, pageW: 210, pageH: 165 },
            { id: "128", name: "TnJ No. 128", width: 45, height: 12, cols: 4, rows: 11,marginT: 12, marginL: 12,gapX: 3, gapY: 2, pageW: 210, pageH: 165 },
            { id: "129", name: "TnJ No. 129", width: 57, height: 17, cols: 3, rows: 8, marginT: 12, marginL: 15,gapX: 4, gapY: 2, pageW: 210, pageH: 165 },
            { id: "130", name: "TnJ No. 130", width: 85, height: 30, cols: 2, rows: 5, marginT: 10, marginL: 15,gapX: 5, gapY: 2, pageW: 210, pageH: 165 }
        ];

        // State Daftar Produk Default
        let productList = [
            {
                badge: "PROMO",
                sku: "SALV-60X60",
                desc: "SALVADORE CREAM 60X60 @1,44 M2 POLISHED",
                regPrice: "140.500",
                promoPrice: "125.284",
                unit: "dus",
                startDate: "01/11",
                endDate: "30/11",
                qty: 6
            }
        ];

        // Map Ukuran Font General
        const FONT_MAP_DESC = { 'xs': 'text-[0.5em]', 'sm': 'text-[0.62em]', 'md': 'text-[0.75em]' };
        const FONT_MAP_REG  = { 'xs': 'text-[0.5em]', 'sm': 'text-[0.6em]', 'md': 'text-[0.7em]' };
        const FONT_MAP_PROMO = { 'sm': 'text-[1.5em]', 'md': 'text-[2.0em]', 'lg': 'text-[2.5em]' };

        document.addEventListener('DOMContentLoaded', () => {
            initLabelOptions();
            renderProductForm();
            setupEventListeners();
            renderPreview();
        });

        function initLabelOptions() {
            const select = document.getElementById('labelSelect');
            select.innerHTML = '';
            LABEL_SIZES.forEach(label => {
                const opt = document.createElement('option');
                opt.value = label.id;
                opt.textContent = `${label.name} (${label.width} x ${label.height} mm - ${label.cols * label.rows} pcs)`;
                select.appendChild(opt);
            });
            select.value = "103";
            updateDetailInfo();
        }

        function updateDetailInfo() {
            const current = getCurrentLabel();
            const info = document.getElementById('labelDetailInfo');
            if(current) {
                info.textContent = `Lembar Cetak: ${current.pageW}x${current.pageH} mm | Slot: ${current.cols * current.rows} stiker (${current.cols} kolom x ${current.rows} baris)`;
            }
        }

        function getCurrentLabel() {
            const val = document.getElementById('labelSelect').value;
            return LABEL_SIZES.find(l => l.id === val) || LABEL_SIZES[0];
        }

        function renderProductForm() {
            const container = document.getElementById('productItemsContainer');
            container.innerHTML = '';

            productList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-2 relative';
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-1">
                        <span class="text-xs font-bold text-blue-600">Barang #${index + 1}</span>
                        ${productList.length > 1 ? `<button type="button" onclick="removeProduct(${index})" class="text-red-500 hover:text-red-700 text-xs font-bold"><i class="fa-solid fa-trash"></i> Hapus</button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Badge</label>
                            <input type="text" data-index="${index}" data-field="badge" value="${item.badge || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">SKU</label>
                            <input type="text" data-index="${index}" data-field="sku" value="${item.sku || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-gray-600 uppercase">Deskripsi</label>
                        <input type="text" data-index="${index}" data-field="desc" value="${item.desc || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Reguler</label>
                            <input type="text" data-index="${index}" data-field="regPrice" value="${item.regPrice || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Promo</label>
                            <input type="text" data-index="${index}" data-field="promoPrice" value="${item.promoPrice || ''}" class="product-input w-full border rounded p-1.5 text-xs text-red-600 font-bold border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Satuan</label>
                            <input type="text" data-index="${index}" data-field="unit" value="${item.unit || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Start</label>
                            <input type="text" data-index="${index}" data-field="startDate" value="${item.startDate || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">End</label>
                            <input type="text" data-index="${index}" data-field="endDate" value="${item.endDate || ''}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-gray-600 uppercase">Qty</label>
                            <input type="number" min="1" data-index="${index}" data-field="qty" value="${item.qty || 1}" class="product-input w-full border rounded p-1.5 text-xs border-gray-300">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.querySelectorAll('.product-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    const field = e.target.getAttribute('data-field');
                    productList[idx][field] = e.target.value;
                    renderPreview();
                });
            });
        }

        function addProduct() {
            productList.push({
                badge: "PROMO",
                sku: "SKU-BARU",
                desc: "NAMA BARANG",
                regPrice: "50.000",
                promoPrice: "45.000",
                unit: "pcs",
                startDate: "",
                endDate: "",
                qty: 1
            });
            renderProductForm();
            renderPreview();
        }

        function removeProduct(index) {
            productList.splice(index, 1);
            renderProductForm();
            renderPreview();
        }

        function setupEventListeners() {
            document.getElementById('labelSelect').addEventListener('change', () => {
                updateDetailInfo();
                renderPreview();
            });
            document.getElementById('btnAddItem').addEventListener('click', addProduct);
            
            ['generalFontDesc', 'generalFontReg', 'generalFontPromo'].forEach(id => {
                document.getElementById(id).addEventListener('change', renderPreview);
            });

            // Tombol Download Template Excel
            document.getElementById('btnDownloadTemplate').addEventListener('click', () => {
                const templateData = [
                    {
                        badge: "PROMO",
                        sku: "SKU-001",
                        desc: "CONTOH NAMA BARANG RETAIL",
                        regPrice: "100.000",
                        promoPrice: "85.000",
                        unit: "pcs",
                        startDate: "01/11",
                        endDate: "30/11",
                        qty: 6
                    }
                ];

                const worksheet = XLSX.utils.json_to_sheet(templateData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Template Label");
                XLSX.writeFile(workbook, "Template_Cetak_Label_TomJerry.xlsx");
            });

            // Handle Upload File Excel / CSV
            document.getElementById('excelFile').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                        if (jsonRows.length > 0) {
                            productList = jsonRows.map(row => ({
                                badge: row.badge || "PROMO",
                                sku: row.sku || "",
                                desc: row.desc || "",
                                regPrice: row.regPrice || "0",
                                promoPrice: row.promoPrice || "0",
                                unit: row.unit || "pcs",
                                startDate: row.startDate || "",
                                endDate: row.endDate || "",
                                qty: parseInt(row.qty) || 1
                            }));
                            renderProductForm();
                            renderPreview();
                            alert(`Berhasil memuat ${productList.length} produk dari file!`);
                        } else {
                            alert("File kosong atau format data tidak ditemukan.");
                        }
                    } catch (err) {
                        console.error(err);
                        alert("Gagal membaca file Excel/CSV. Pastikan format kolom sesuai.");
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function renderPreview() {
            const label = getCurrentLabel();
            const sheet = document.getElementById('paperSheet');

            sheet.style.width = `${label.pageW}mm`;
            sheet.style.height = `${label.pageH}mm`;
            sheet.style.paddingTop = `${label.marginT}mm`;
            sheet.style.paddingLeft = `${label.marginL}mm`;
            sheet.style.gridTemplateColumns = `repeat(${label.cols}, ${label.width}mm)`;
            sheet.style.gridTemplateRows = `repeat(${label.rows}, ${label.height}mm)`;
            sheet.style.columnGap = `${label.gapX}mm`;
            sheet.style.rowGap = `${label.gapY}mm`;
            sheet.innerHTML = '';

            const totalSlots = label.cols * label.rows;
            
            let renderQueue = [];
            productList.forEach(prod => {
                for(let q = 0; q < parseInt(prod.qty || 1); q++) {
                    renderQueue.push(prod);
                }
            });

            const fDesc = FONT_MAP_DESC[document.getElementById('generalFontDesc').value];
            const fReg = FONT_MAP_REG[document.getElementById('generalFontReg').value];
            const fPromo = FONT_MAP_PROMO[document.getElementById('generalFontPromo').value];

            for (let i = 0; i < totalSlots; i++) {
                const card = document.createElement('div');
                card.className = 'label-card p-1 text-gray-800 leading-none flex flex-col justify-between';
                card.style.width = `${label.width}mm`;
                card.style.height = `${label.height}mm`;

                if (i < renderQueue.length) {
                    const p = renderQueue[i];
                    const badgeHtml = p.badge 
                        ? `<span class="bg-red-600 text-white font-black rounded-full px-1.5 py-0.5 text-[0.45em] tracking-tighter uppercase whitespace-nowrap">${p.badge}</span>`
                        : `<span></span>`;

                    const dateHtml = (p.startDate || p.endDate) 
                        ? `<span class="text-[0.4em] text-gray-500 font-semibold">${p.startDate || ''}-${p.endDate || ''}</span>` 
                        : '';

                    card.innerHTML = `
                        <!-- Header Top: Badge & SKU/Date -->
                        <div class="flex justify-between items-center border-b border-gray-300 pb-0.5 gap-1">
                            ${badgeHtml}
                            <div class="flex items-center gap-1">
                                ${dateHtml}
                                <span class="font-mono text-[0.48em] text-gray-600 font-bold whitespace-nowrap">${p.sku}</span>
                            </div>
                        </div>

                        <!-- Deskripsi Barang -->
                        <div class="text-center font-extrabold leading-tight uppercase my-0.5 tracking-tight text-gray-900 line-clamp-2 ${fDesc}">
                            ${p.desc}
                        </div>

                        <!-- Area Harga Promo & Coret -->
                        <div class="relative flex-1 flex items-center justify-center min-h-0">
                            <!-- Harga Reguler Coret -->
                            <div class="absolute top-0 left-0 text-gray-400 line-through font-semibold whitespace-nowrap ${fReg}">
                                Rp${p.regPrice}
                            </div>
                            
                            <!-- Harga Promo Dominan Center -->
                            <div class="text-red-600 font-black tracking-tighter flex items-baseline justify-center ${fPromo}">
                                <span class="text-[0.45em] mr-0.5 font-bold">Rp</span>
                                <span>${p.promoPrice}</span>
                            </div>
                        </div>

                        <!-- Footer Satuan -->
                        <div class="text-right border-t border-gray-200 pt-0.5">
                            <span class="text-blue-900 font-bold text-[0.55em]">
                                / ${p.unit}
                            </span>
                        </div>
                    `;
                } else {
                    card.style.border = '1px dashed #e5e7eb';
                    card.style.background = '#fafafa';
                }
                sheet.appendChild(card);
            }
        }
    </script>
</body>
</html>
